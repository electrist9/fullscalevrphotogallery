<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FullScaleVR フォトギャラリー (M3)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; color: #e8eaed; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
             background: #1d2025; border-bottom: 1px solid #2c3038; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0 12px 0 0; }
    header label { font-size: 13px; color: #aab; }
    header input[type="number"] { width: 70px; padding: 4px 6px; background: #14161a;
             color: #e8eaed; border: 1px solid #3a404a; border-radius: 4px; }
    header select { padding: 4px 6px; background: #14161a; color: #e8eaed;
             border: 1px solid #3a404a; border-radius: 4px; max-width: 260px; }
    header button { padding: 5px 12px; background: #2f6feb; color: #fff; border: 0;
             border-radius: 4px; cursor: pointer; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px; padding: 16px; }
    .card { background: #1d2025; border-radius: 8px; overflow: hidden; cursor: pointer;
            border: 1px solid #2c3038; }
    .card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .card .meta { padding: 8px 10px; font-size: 12px; color: #aab; }
    .card .meta b { color: #e8eaed; font-size: 13px; display: block; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
    .badge.ok { background: #24462c; color: #9f6; }
    .badge.ng { background: #4a2626; color: #f99; }
    .badge.album { background: #26324a; color: #9cf; margin-right: 4px; }
    #viewer { position: fixed; inset: 0; background: #000; display: none; }
    #viewer.active { display: block; }
    #viewer canvas { width: 100%; height: 100%; display: block; }
    #viewerbar { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 12px;
                 align-items: center; padding: 10px 14px; background: rgba(20,22,26,.85); }
    #viewerbar button { padding: 6px 14px; background: #2c3038; color: #fff; border: 0;
                 border-radius: 4px; cursor: pointer; }
    #viewerinfo { font-size: 13px; color: #aab; }
    #viewerinfo b { color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>FullScaleVR ギャラリー <small style="color:#889">M3</small></h1>
    <label>写真推定IPD (mm) <input id="ipd" type="number" min="50" max="80" step="0.5" value="63" /></label>
    <label>アルバム <select id="albumsel"></select></label>
    <button id="reindex" title="新規・変更のみの差分再スキャン。Shift+クリックで全再実行">再スキャン</button>
    <button id="vrbtn">VRで開く</button>
    <span id="status" style="font-size:12px;color:#889"></span>
  </header>
  <div id="grid"></div>
  <div id="viewer">
    <div id="viewerbar">
      <button id="back">← 一覧</button>
      <span id="viewerinfo"></span>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
